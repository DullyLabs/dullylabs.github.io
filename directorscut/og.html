<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex" />
<title>Director's Cut — share card source</title>

<!-- Source for /directorscut/assets/og.png, the 1200x630 card link unfurlers
     show. Crawlers read og:image from index.html and download the PNG; this
     file only exists so the PNG can be regenerated. To rebuild, from the repo
     root (through a server, so the web font loads):

       python3 -m http.server 8899 &

       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
         --headless --disable-gpu --hide-scrollbars \
         --force-color-profile=srgb --virtual-time-budget=8000 \
         --window-size=1200,630 \
         --screenshot="directorscut/assets/og.png" \
         http://localhost:8899/directorscut/og.html

     Then bump ?v= on og:image and twitter:image in index.html. -->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#fbf4ea;color:#23180f;font-family:"Bricolage Grotesque",system-ui,sans-serif}
body{position:relative}
.wm{position:absolute;top:56px;left:80px;font-weight:700;font-size:28px;letter-spacing:-.01em}
h1{position:absolute;left:80px;top:170px;font-weight:700;font-size:92px;line-height:.98;letter-spacing:-.035em}
.rig{position:absolute;right:80px;top:84px;width:500px;display:flex;flex-direction:column;align-items:center}
.body{width:460px;height:236px;background:#1c1c1e;border-radius:40px;padding:14px;position:relative}
.tl{position:absolute;top:4px;left:50%;width:8px;height:8px;margin-left:-4px;background:#ff2d20}
.scr{width:100%;height:100%;background:#000;position:relative;overflow:hidden}
.scr svg,.tile svg{display:block;width:100%;height:100%}
.pgm{position:absolute;top:10px;left:10px;background:#ff2d20;color:#fff;font:700 15px "JetBrains Mono",monospace;letter-spacing:2.4px;padding:6px 9px;line-height:1}
.rec{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);padding:5px 8px;display:flex;align-items:center;gap:6px;font:700 13px "JetBrains Mono",monospace;color:#fff}
.rec i{width:10px;height:10px;background:#ff2d20}
.tri{width:150px;height:60px;display:block}
.strip{width:440px;margin-top:6px;background:#0b0d0e;padding:12px;display:flex;gap:6px}
.tile{flex:1}
.tile b{display:flex;align-items:center;gap:6px;font:700 13px "JetBrains Mono",monospace;letter-spacing:2px;color:#7f888a;margin-bottom:6px}
.tile .v{aspect-ratio:16/9;background:#000}
.tile.live b{color:#e8ecec}
.tile.live b:after{content:"";width:9px;height:9px;background:#ff2d20}
.tile.live .v{outline:3px solid #ff2d20;outline-offset:-3px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
 <defs><g id="scene">
  <rect width="1600" height="560" fill="#f1dfc4"/>
  <path d="M0 560H1600L2000 1100H-400Z" fill="#c98f55"/>
  <rect x="514" y="84" width="572" height="302" fill="#23180f"/><rect x="520" y="90" width="560" height="290" fill="#fff"/>
  <text x="800" y="275" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="700" font-size="110" fill="#2a2a2a">Hello!</text>
  <rect width="150" height="560" fill="#b8433a"/><rect x="1450" width="150" height="560" fill="#b8433a"/><rect width="1600" height="60" fill="#b8433a"/>
  <path d="M740 760L860 760L875 570L725 570Z" fill="#8a5a35"/><path d="M716 574H884L880 550H720Z" fill="#6c4527"/>
  <g transform="translate(560 760) scale(1.5)">
   <path d="M-14 0V-105M14 0V-105" stroke="#23476b" stroke-width="16" stroke-linecap="round"/>
   <rect x="-36" y="-195" width="72" height="100" rx="26" fill="#2f5d8a"/>
   <path d="M6 -193H30L18 -157Z" fill="#fff"/>
   <circle cx="0" cy="-226" r="36" fill="#f2c29b"/>
   <path d="M-36 -232Q-30 -268 4 -266Q34 -264 36 -236Q20 -252 -10 -248Q-28 -246 -36 -232Z" fill="#3b2a20"/>
   <circle cx="12" cy="-226" r="3" fill="#111"/><circle cx="26" cy="-226" r="3" fill="#111"/>
  </g>
  <g fill="#4a3a33"><circle cx="350" cy="905" r="46"/><circle cx="650" cy="905" r="46"/><circle cx="950" cy="905" r="46"/><circle cx="1250" cy="905" r="46"/></g>
 </g></defs>
</svg>
<div class="wm">Director's Cut</div>
<h1>Your iPhone<br />runs the<br />camera.</h1>
<div class="rig">
 <div class="body"><i class="tl"></i><div class="scr"><svg viewBox="400 350 320 180" preserveAspectRatio="xMidYMid slice"><use href="#scene"/></svg><span class="pgm">PGM · TIGHT</span><span class="rec"><i></i>REC</span></div></div>
 <svg class="tri" viewBox="0 0 120 60" preserveAspectRatio="none"><path d="M60 0L12 60M60 0v60M60 0l48 60" stroke="#3a3a3c" stroke-width="3" fill="none"/><rect x="50" y="0" width="20" height="5" fill="#3a3a3c"/></svg>
 <div class="strip">
  <div class="tile"><b>WIDE</b><div class="v"><svg viewBox="0 0 1600 900"><use href="#scene"/></svg></div></div>
  <div class="tile live"><b>TIGHT</b><div class="v"><svg viewBox="400 350 320 180"><use href="#scene"/></svg></div></div>
  <div class="tile"><b>PUNCH</b><div class="v"><svg viewBox="300 300 560 315"><use href="#scene"/></svg></div></div>
 </div>
</div>
</body>
</html>
