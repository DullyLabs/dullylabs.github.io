<!doctype html><html lang="en"><head><meta charset="utf-8"><title>og</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&display=swap" rel="stylesheet">
<style>
:root{--street:#f5eedb;--street-ink:#173b2b;--street-edge:#173b2b30;--road:#d9d6bd;--far:color-mix(in oklch,var(--street-ink) 12%,var(--street));--mid:color-mix(in oklch,var(--street-ink) 30%,var(--street));--harbour-tone:color-mix(in oklch,var(--far) 70%,var(--mid))}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:var(--street);position:relative}
.harbour{position:absolute;left:70px;bottom:310px;width:520px;color:var(--harbour-tone)}
.harbour svg{display:block;width:100%;overflow:visible;opacity:.8}
.kowloon-low{fill:var(--harbour-tone);opacity:.2}.icc,.mplus{fill:var(--harbour-tone)}.icc-face{fill:var(--street);opacity:.2}.icc-crown{stroke:#e7ce91;opacity:.45}.harbour-ripples{stroke:var(--harbour-tone)}.mplus-screen{fill:var(--harbour-tone)}.mplus-art{stroke:#e7c391;opacity:.45}.mplus-mark{fill:#f5eedb;opacity:.5}.harbour-reflection{stroke:#d8bc83;opacity:.45}.star-ferry{fill:var(--mid);color:var(--mid)}.ferry-deck,.ferry-star{fill:var(--street)}.ferry-windows{stroke:var(--mid)}.ferry-wake{stroke:var(--harbour-tone);opacity:.5}
.skyline{position:absolute;left:0;bottom:190px;width:1200px;height:150px}
.road{position:absolute;left:0;right:0;bottom:0;height:190px;background:var(--road);border-top:3px solid var(--street-edge)}
.road:before{content:"";position:absolute;left:0;right:0;top:38%;height:4px;background:repeating-linear-gradient(90deg,#f4d468 0 60px,transparent 60px 140px)}
.bus{position:absolute;right:30px;bottom:56px;width:760px}
