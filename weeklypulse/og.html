<title>Weekly Pulse — share card source</title>

<!-- ──────────────────────────────────────────────────────────────
     Source for /weeklypulse/assets/og.png, the 1200x630 image that
     link unfurlers (Slack, iMessage, X, LinkedIn, WhatsApp) show
     when the page is shared. Crawlers never see this file: they read
     og:image from index.html and download the flat PNG. This exists
     so the PNG can be regenerated instead of re-screenshotted.

     To rebuild after editing, from the repo root. It has to go through a
     server: the stylesheets below are root-absolute, and over file:// they
     resolve against the filesystem root and silently 404, which bakes an
     unstyled card into the PNG.

       python3 -m http.server 8899 &

       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
         --headless --disable-gpu --hide-scrollbars \
         --force-color-profile=srgb --virtual-time-budget=8000 \
         --window-size=1200,630 \
         --screenshot="weeklypulse/assets/og.png" \
         http://localhost:8899/weeklypulse/og.html

     Then bump the ?v= on og:image in index.html so scrapers that have
     cached the old image fetch the new one.

     The card is self-contained (inline CSS, one web font) so it is
     frozen artwork that matches the landing page's opening beat:
     cream canvas, ink type, and the orange dot as the full stop.
     ────────────────────────────────────────────────────────────── -->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;800&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#F3EFE7;color:#111;font-family:"Inter Tight",system-ui,sans-serif}
body{display:flex;flex-direction:column;justify-content:center;padding:0 88px}
.mark{position:absolute;top:56px;left:88px;font-weight:800;font-size:28px;letter-spacing:-.02em}
h1{font-weight:800;font-size:150px;line-height:.95;letter-spacing:-.05em}
.dot{display:inline-block;width:.17em;height:.17em;margin-left:.04em;border-radius:50%;background:#FF5B1F}
</style>
</head>
<body>
<div class="mark">Weekly Pulse</div>
<h1>Track Your<br />Pulse<span class="dot"></span></h1>
</body>
</html>
