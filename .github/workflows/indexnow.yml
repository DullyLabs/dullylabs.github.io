name: IndexNow
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      HOST: dullylabs.com
      KEY: 41833a008943b687d5091489c11a5835
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Ping IndexNow for changed pages
        run: |
          [ -f sitemap.xml ] && [ "${BEFORE//0/}" ] || { echo "Nothing to ping"; exit 0; }
          urls=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- '*.html' \
            | sed -E 's#(^|/)index\.html$#/#; s#^([^/])#/\1#' \
            | while read -r p; do grep -q "<loc>https://$HOST$p</loc>" sitemap.xml && echo "https://$HOST$p"; done)
          [ -n "$urls" ] || { echo "No sitemap pages changed"; exit 0; }
          payload=$(jq -n --arg host "$HOST" --arg key "$KEY" --arg urls "$urls" \
            '{host:$host,key:$key,keyLocation:"https://\($host)/\($key).txt",urlList:($urls|split("\n"))}')
          echo "$payload"
          sleep 90 # let GitHub Pages finish deploying
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$payload"
